analysisStructureBrief:
  overview: >-
    The analysis links observed earthquake response evidence to a transparent
    planning chain: baseline population and facilities, historical and event
    heat, total-constrained housing-loss allocation, older-person cooling need,
    demand-side electricity requirements, and a literature-anchored 30-day
    mortality contrast. Every model input is traceable to a final variable or
    explicit scenario parameter, and all outputs link to completed figures and
    municipality tables.
  levels:
    - levelName: Baseline and Operational Context
      levelAim: Describe population vulnerability, listed shelters, damage evidence, occupancy, water outages, and confirmed cooling interruptions without imputation.
      inputs:
        - 2020 population and boundaries
        - Designated-shelter points
        - Official damage, evidence, and service observations
      modelOrMethod: Descriptive spatial overlay and time-ordered reporting; no causal model or missing-value imputation is used.
      outputs:
        - "Figure: Population and Older-Age Vulnerability in Kumamoto"
        - "Figure: Minami Ward Shelter and Cooling-Risk Screening"
      interpretation: Establishes who may be vulnerable and where response constraints were reported, while distinguishing nominal facility presence from verified operation or effective cooling.
    - levelName: Event and Historical Heat Context
      levelAim: Compare observed event heat with historical matching dates and estimate historical spatial heat heterogeneity.
      inputs:
        - Five-station 2026 event-window JMA data
        - Five-station and 17-station 2021-2025 matching-date JMA data
        - Terra and Aqua MODIS land-surface temperature
      modelOrMethod: Daily threshold classification, pooled historical envelopes, leave-one-station-out model selection, and inverse-distance-squared residual or municipality interpolation. Historical surfaces are scenarios, not forecasts.
      outputs:
        - "Figure: Event-Window Daytime and Nighttime Heat"
        - "Figure: Historical Heat Spatial Heterogeneity and Calibration"
        - "Variable: Expected High-Heat Scenario Days"
      interpretation: Quantifies common outdoor heat conditions and spatial heterogeneity without claiming that the earthquake changed outdoor temperature.
    - levelName: Housing-Loss Allocation and Older-Person Exposure
      levelAim: Allocate official structural-loss totals across disclosure groups and estimate the associated older population.
      inputs:
        - Full- and half-collapse official totals
        - General households, mapped building count, and mapped footprint area
        - Epicentral distance and population age 65 or older
      modelOrMethod: Twenty-seven scenarios combine three exposure proxies, three exponential distance-decay scales, and three half-collapse weights. The normalized pointwise median is constrained to 303.5 central functionally lost residences, and population exposure uses the modeled housing-loss share.
      outputs:
        - "Figure: Functional Housing Loss and Older-Person Exposure"
        - "Table: Municipality Housing Loss and Cooling Need"
        - "Analysis product: Population disclosure-group exposure grid"
      interpretation: Produces a sensitivity-bounded allocation nowcast, not building classification, verified habitability, displacement, or individual exposure.
    - levelName: Cooling Protection and Electricity Demand
      levelAim: Translate modeled older-person exposure into a 30-day placement bound and protective-cooling electricity demand.
      inputs:
        - Estimated affected population age 65 or older
        - Thirty-day planning horizon
        - Low, Central, and High engineering parameter bundles
      modelOrMethod: No-placement person-days equal the cooling-assessment population times 30. Thermal load uses 3.5 m2 per person and scenario load density; peak electric power divides diversified thermal load by COP, and daily electricity multiplies power by operating hours.
      outputs:
        - "Figure: Older-Person Cooling Need and Placement Bound"
        - "Figure: Emergency Cooling Electricity Requirements"
        - "Table: Municipality Cooling Electricity Planning Summary"
        - "Analysis products: Cooling-need grid and cooling-electricity scenario grid"
      interpretation: Estimates demand needed to protect potentially affected older residents. It does not estimate verified placement, available power, or an emergency power gap.
    - levelName: Cooling-Loss Mortality Contrast
      levelAim: Estimate the 30-day health-risk contrast between effective-cooling and no-effective-cooling states under identical outdoor heat.
      inputs:
        - Municipality age-65-plus mortality baseline
        - Expected High-Heat Scenario Days
        - No-placement population equivalent
        - Katz et al. cooling-effect estimate and 95% confidence interval
      modelOrMethod: Converts annual baseline rates to daily probabilities, applies the with-cooling heat odds ratio, then applies the no-cooling versus cooling relative odds ratio on high-heat days and compounds 30-day risks. The estimand is a transferred planning contrast, not a causal earthquake effect.
      outputs:
        - "Figure: Cooling-Loss Mortality Risk Distribution"
        - "Table: Municipality Cooling-Loss Health-Risk Summary"
        - "Analysis product: Municipality cooling-loss mortality scenario"
      interpretation: Indicates where loss of effective cooling could raise older-person mortality risk if protection is not restored; it does not report observed or earthquake-attributable deaths.
