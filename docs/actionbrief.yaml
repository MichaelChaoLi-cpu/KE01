doc_type: actionbrief
version: 0.1.0

datasetDictionary:
  population_and_boundaries:
    datasetSourceName: 2020 Population Census T001231 and e-Stat Kumamoto small-area geography
    datasetDescription: Population, household, age-structure, 125 m mesh, disclosure-group, and municipality geography used in the final baseline, exposure, and spatial assignments.
    datasetAttribute: other
    datasetProvider: Statistics Bureau of Japan and e-Stat
    datasetGenerationInfo: Official 2020 census tabulation joined to official mesh and small-area geometries; suppressed values remain missing and disclosure groups are preserved.
    datasetPeriod: 2020 census reference year
    datasetScale: Kumamoto Prefecture; 62,945 populated meshes and 36,657 disclosure groups
    datasetSpatialResolution: Populated 125 m mesh, official disclosure group, and small-area municipality geometry
    datasetTemporalResolution: Single census reference year
    datasetPreprocessingInfo: Decoded CP932 source, standardized readable fields, retained official suppression, formed disclosure groups, calculated older-age shares, and projected geographies for spatial analysis.
  mapped_buildings:
    datasetSourceName: GSI vector-map building polygons, 2026-04-01 release
    datasetDescription: Building polygons used only to construct mapped building-count and footprint-area exposure proxies for housing-loss allocation.
    datasetAttribute: geojson
    datasetProvider: Geospatial Information Authority of Japan
    datasetGenerationInfo: Building features were extracted from prefecture-covering GSI vector tiles at zoom 15 and clipped to Kumamoto Prefecture.
    datasetPeriod: Release dated 2026-04-01
    datasetScale: Kumamoto Prefecture; 1,036,590 mapped building polygons
    datasetSpatialResolution: Individual mapped building polygon at GSI vector-tile resolution
    datasetTemporalResolution: Single map release
    datasetPreprocessingInfo: Deduplicated tile-edge features, validated geometry, calculated footprint area, and aggregated counts and areas to census disclosure groups by representative point.
  designated_shelters:
    datasetSourceName: 43000_1_designated_shelters.csv
    datasetDescription: Official designated-shelter points used for nominal nearest-shelter access and the Minami Ward operational screening.
    datasetAttribute: table
    datasetProvider: Geospatial Information Authority of Japan
    datasetGenerationInfo: Kumamoto Prefecture designated-shelter release retrieved on 2026-08-02; operational and cooling status are not inferred from listing presence.
    datasetPeriod: Response-time release available 2026-08-02
    datasetScale: Kumamoto Prefecture; 1,315 facility points
    datasetSpatialResolution: Facility point coordinates
    datasetTemporalResolution: Single response-time snapshot
    datasetPreprocessingInfo: Standardized ten official fields, preserved blank operational fields as missing, validated coordinates, created point geometry, and calculated straight-line nearest-shelter distance.
  official_housing_damage:
    datasetSourceName: FDMA and Kumamoto City earthquake damage reports through 2026-08-01
    datasetDescription: Time-stamped official housing-damage totals used to constrain full- and half-collapse scenario totals.
    datasetAttribute: other
    datasetProvider: Fire and Disaster Management Agency and Kumamoto City
    datasetGenerationInfo: Five report snapshots were manually transcribed with source organization, report number, page, geography, time, and status.
    datasetPeriod: 2026-07-28 to 2026-08-01
    datasetScale: Kumamoto Prefecture and reported subareas; 5 snapshots
    datasetSpatialResolution: Prefecture or explicitly reported municipality/ward
    datasetTemporalResolution: Irregular official report snapshots
    datasetPreprocessingInfo: Harmonized timestamps and damage classes, retained source provenance, and selected the latest usable prefecture totals of 181 full and 245 half collapses.
  damage_evidence:
    datasetSourceName: Official geolocated and geographically bounded damage claims through 2026-08-02
    datasetDescription: Confirmed or probable official damage claims used as contextual evidence, not as building-level labels.
    datasetAttribute: other
    datasetProvider: Fire and Disaster Management Agency and Kumamoto City
    datasetGenerationInfo: Nine claims were registered from official reports with evidence tier, location precision, damage class, and source traceability.
    datasetPeriod: 2026-07-28 to 2026-08-02
    datasetScale: Kumamoto Prefecture; 9 evidence claims
    datasetSpatialResolution: Point, municipality, ward, or other explicitly bounded reported geography
    datasetTemporalResolution: Irregular report observations
    datasetPreprocessingInfo: Standardized evidence IDs, timestamps, location precision, verification status, and functional-loss interpretation while preserving uncertainty.
  service_disruption:
    datasetSourceName: Official shelter occupancy, water, and cooling-related reports through 2026-08-02
    datasetDescription: Time-stamped operational observations used only for the Minami Ward shelter, occupancy, water, and cooling screening.
    datasetAttribute: other
    datasetProvider: Fire and Disaster Management Agency and Kumamoto City
    datasetGenerationInfo: Fourteen observations were extracted from official reports with geography, disruption type, affected count, and provenance.
    datasetPeriod: 2026-07-28 to 2026-08-02
    datasetScale: Kumamoto Prefecture and reported municipalities/wards; 14 observations
    datasetSpatialResolution: Reported prefecture, municipality, ward, or facility context
    datasetTemporalResolution: Irregular report observations
    datasetPreprocessingInfo: Harmonized timestamps, disruption categories, occupancy and outage counts, and cooling-loss evidence; missing fields remain unknown rather than zero.
  event_heat:
    datasetSourceName: JMA AMeDAS event-window daily summaries
    datasetDescription: Observed daily maximum and minimum air temperatures for five Kumamoto stations during the first seven event days.
    datasetAttribute: table
    datasetProvider: Japan Meteorological Agency
    datasetGenerationInfo: Hourly AMeDAS observations were refreshed through 2026-08-03 18:50 JST and aggregated to station-day summaries with partial-day status.
    datasetPeriod: 2026-07-28 to 2026-08-03
    datasetScale: Five event stations; 35 station-days
    datasetSpatialResolution: Weather-station point
    datasetTemporalResolution: Daily summaries derived from hourly observations
    datasetPreprocessingInfo: Standardized station metadata, calculated daily extrema and completeness, flagged the latest partial day, and derived hot-day and hot-night indicators only when supported.
  historical_event_window_heat:
    datasetSourceName: JMA matching-date historical summaries for five event stations
    datasetDescription: Five-year matching-date station data used to form the pooled historical median and observed range for the 30-day event window.
    datasetAttribute: table
    datasetProvider: Japan Meteorological Agency
    datasetGenerationInfo: Daily JMA observations for the same five event stations were aligned by event day across 2021-2025.
    datasetPeriod: Matching 2021-2025 dates for July 28 to August 26
    datasetScale: Five stations by five years by 30 days; 750 station-year-days
    datasetSpatialResolution: Weather-station point
    datasetTemporalResolution: Daily
    datasetPreprocessingInfo: Parsed JMA daily tables, standardized units and station metadata, aligned dates to event day, and calculated threshold indicators without forecasting 2026 conditions.
  historical_spatial_heat:
    datasetSourceName: JMA matching-date historical summaries for 17 Kumamoto-area stations
    datasetDescription: Five-year station history used for MODIS calibration and municipality expected high-heat scenario days.
    datasetAttribute: table
    datasetProvider: Japan Meteorological Agency
    datasetGenerationInfo: Daily observations from 17 stations were collected for the same 30-day seasonal window in each year from 2021 through 2025.
    datasetPeriod: Matching 2021-2025 dates for July 28 to August 26
    datasetScale: Seventeen stations by five years by 30 days; 2,550 station-year-days
    datasetSpatialResolution: Weather-station point
    datasetTemporalResolution: Daily
    datasetPreprocessingInfo: Parsed and quality-checked daily extrema, retained 2,546 complete temperature records, calculated threshold indicators, and interpolated five-year mean high-heat counts to municipalities.
  modis_surface_heat:
    datasetSourceName: Terra MOD11A2 and Aqua MYD11A2 eight-day land-surface temperature
    datasetDescription: Historical daytime and nighttime land-surface temperature used only to represent spatial heat heterogeneity and calibrate historical air-temperature surfaces.
    datasetAttribute: raster
    datasetProvider: NASA Land Processes Distributed Active Archive Center
    datasetGenerationInfo: Eighty Terra and Aqua source files covering matching 2021-2025 seasonal periods were processed over Kumamoto Prefecture.
    datasetPeriod: Matching seasonal periods in 2021-2025
    datasetScale: Kumamoto Prefecture; 8,661 approximately 1 km pixels from 80 files
    datasetSpatialResolution: Approximately 1 km MODIS sinusoidal pixel
    datasetTemporalResolution: Eight-day composite, aggregated across matching five-year periods
    datasetPreprocessingInfo: Applied strict and relaxed quality masks, converted scaled Kelvin to Celsius, averaged Terra and Aqua products without spatial gap filling, and retained coverage-support metadata.
  mortality_baseline:
    datasetSourceName: e-Stat Vital Statistics all-cause deaths, 2020-2024
    datasetDescription: Official municipality-age death counts and 2020 population denominators used to construct the age-65-plus mortality baseline; only the 45 age-65-plus municipality rows enter final estimation.
    datasetAttribute: table
    datasetProvider: Ministry of Health, Labour and Welfare via e-Stat
    datasetGenerationInfo: Annual municipality all-cause deaths for 2020-2024 were pooled and linked to the fixed 2020 census population denominator.
    datasetPeriod: Deaths 2020-2024; population reference year 2020
    datasetScale: 45 Kumamoto municipalities; 45 age-65-plus analytical rows
    datasetSpatialResolution: Municipality, with Kumamoto City wards consolidated
    datasetTemporalResolution: Five-year pooled annual baseline
    datasetPreprocessingInfo: Parsed official tables, standardized municipality codes, consolidated wards, pooled age-65-plus deaths, and calculated annual mortality rates per 100,000 using the declared fixed denominator.
  cooling_engineering_parameters:
    datasetSourceName: Japanese shelter-space, gymnasium HVAC-load, and efficiency guidance
    datasetDescription: Literature and guidance values used to define Low, Central, and High cooling-electricity demand bundles.
    datasetAttribute: other
    datasetProvider: Cabinet Office; Ministry of Land, Infrastructure, Transport and Tourism; Agency for Natural Resources and Energy
    datasetGenerationInfo: The analysis combines a 3.5 m2 per-person shelter area with documented HVAC load and efficiency concepts into three transparent planning bundles.
    datasetPeriod: Guidance available before or during the 2026 response
    datasetScale: Three engineering scenario bundles applied to 36,657 disclosure groups
    datasetSpatialResolution: Non-spatial parameter set applied to each disclosure group
    datasetTemporalResolution: Static scenario assumptions
    datasetPreprocessingInfo: Encoded Low, Central, and High load density, COP, diversity, and operating-hour combinations; calculated demand while leaving verified supply and power gap missing.
  cooling_effect:
    datasetSourceName: Katz et al. 2025 no-air-conditioning mortality effect
    datasetDescription: Published no-cooling versus cooling relative odds ratio used for the 30-day mortality planning contrast under identical outdoor heat.
    datasetAttribute: other
    datasetProvider: Katz et al., JAMA Internal Medicine
    datasetGenerationInfo: Lag-0 primary estimate was transcribed as relative odds ratio 1.08 with 95% confidence interval 1.01 to 1.15; the with-cooling extreme-heat odds ratio is 1.03.
    datasetPeriod: Published 2025
    datasetScale: One central effect estimate and its 95% confidence interval
    datasetSpatialResolution: Non-spatial transferred literature estimate
    datasetTemporalResolution: Static effect parameter
    datasetPreprocessingInfo: Applied the effect only between effective-cooling and no-effective-cooling states, held outdoor heat fixed, and varied only the published effect interval for uncertainty.

variableDictionary:
  municipality:
    variableNameInDataset: Municipality
    variableNameInArticle: Municipality
    variableAttribute: categorical
    variableUnit: name
    variableDescription: Forty-five-unit reporting geography with Kumamoto City wards consolidated where required.
    variableSource: population_and_boundaries and derived municipality analytical products
    observationNumber: 45
  total_population:
    variableNameInDataset: Total Population
    variableNameInArticle: Total population
    variableAttribute: count
    variableUnit: persons
    variableDescription: Official 2020 census resident count at mesh or disclosure-group level.
    variableSource: population_and_boundaries
    observationNumber: 36657
  population_age_65_plus:
    variableNameInDataset: Population Age 65+
    variableNameInArticle: Population age 65 or older
    variableAttribute: count
    variableUnit: persons
    variableDescription: Official age-65-plus resident count at the disclosure geography.
    variableSource: population_and_boundaries
    observationNumber: 36657
  population_age_65_plus_share:
    variableNameInDataset: Population Age 65+ Share
    variableNameInArticle: Population age 65 or older share
    variableAttribute: continuous
    variableUnit: proportion
